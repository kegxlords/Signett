<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coupon — Signett Jewelries</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body>
  <div class="page">
    <div class="card" style="margin-top:16px;text-align:center;">
      <div style="font-size:44px;">🎟️</div>
      <div id="alert" class="alert" style="text-align:left;"></div>
      <div class="field" style="margin-top:10px;">
        <input class="input" id="code" placeholder="ENTER COUPON CODE" style="text-align:center;text-transform:uppercase;letter-spacing:2px;font-weight:700;" />
      </div>
      <button class="btn btn-gold btn-block" onclick="redeem()">Redeem Coupon</button>
    </div>
    <div class="section-title">My Redemptions</div>
    <div class="card" style="padding:0;" id="histBox"><div class="empty">Loading...</div></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/api-client.js"></script>
  <script src="../assets/js/auth-guard.js"></script>
  <script src="../assets/js/components.js"></script>
  <script>
    async function loadHist() {
      const { data } = await window.supabase.from('coupon_redemptions')
        .select('*, coupons(code)').eq('user_id', CURRENT_USER.id).order('created_at', { ascending: false });
      histBox.innerHTML = (data && data.length)
        ? data.map(r => `<div style="display:flex;justify-content:space-between;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.07);">
            <span style="font-weight:600;font-family:monospace;">${r.coupons?.code}</span>
            <span style="color:var(--success);font-weight:700;">+${SIGNETT.money(r.amount_credited)}</span></div>`).join('')
        : '<div class="empty">No coupons redeemed yet.</div>';
    }
    window.redeem = async function () {
      const alertBox = document.getElementById('alert');
      alertBox.className = 'alert';
      const result = await callApi('/api/redeem-coupon', { code: document.getElementById('code').value });
      if (result.success) {
        alertBox.className = 'alert alert-success show';
        alertBox.textContent = `✅ Coupon redeemed! ${SIGNETT.money(result.amount)} added to your wallet.`;
        document.getElementById('code').value = '';
        loadHist();
      } else {
        alertBox.className = 'alert alert-error show';
        alertBox.textContent = '❌ ' + (result.error || 'Redemption failed');
      }
    };
    document.addEventListener('user:ready', () => { SIGNETT.renderSubHeader('Coupon'); SIGNETT.renderNav(); loadHist(); });
  </script>
</body>
</html>
