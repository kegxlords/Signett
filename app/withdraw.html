<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Withdraw — Signett Jewelries</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body>
  <div class="page">
    <div class="card" style="margin-top:16px;">
      <div class="stats-card" style="background:rgba(0,0,0,.25);border-radius:10px;padding:12px;margin-bottom:14px;">
        <div class="stat-cell"><div class="lbl">Balance</div><div class="val" id="wBal">0.00</div></div>
        <div class="stat-cell"><div class="lbl">Min</div><div class="val" id="wMin">—</div></div>
        <div class="stat-cell"><div class="lbl">Fee</div><div class="val" id="wFeePct">—</div></div>
      </div>

      <div style="text-align:center;font-size:12px;color:var(--success);font-weight:600;margin-bottom:12px;">
        ⚡ 24/7 Withdrawals — no waiting windows
      </div>

      <div id="alert" class="alert"></div>
      <div id="formArea"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/api-client.js"></script>
  <script src="../assets/js/auth-guard.js"></script>
  <script src="../assets/js/components.js"></script>
  <script>
    let CFG = { min: 1000, fee: 8 };
    let BANKS = [];

    document.addEventListener('user:ready', async () => {
      SIGNETT.renderSubHeader('Withdraw');
      SIGNETT.renderNav();

      const { data: w } = await window.supabase.from('wallets').select('balance').eq('user_id', CURRENT_USER.id).single();
      document.getElementById('wBal').innerText = Number(w?.balance || 0).toLocaleString('en-NG', { minimumFractionDigits: 2 });

      const { data: s } = await window.supabase.from('settings').select('key, value');
      const g = (k, d) => { const x = s?.find(i => i.key === k); return x ? x.value : d; };
      CFG.min = parseFloat(g('min_withdrawal', 1000));
      CFG.fee = parseFloat(g('withdrawal_fee_percent', 8));
      wMin.innerText = Number(CFG.min).toLocaleString();
      wFeePct.innerText = CFG.fee + '%';

      const { data: banks } = await window.supabase.from('bank_accounts').select('*').eq('user_id', CURRENT_USER.id);
      BANKS = banks || [];
      renderForm();
    });

    function renderForm() {
      const area = document.getElementById('formArea');
      if (!BANKS.length) {
        area.innerHTML = '<div class="empty">No bank account bound.<br><br><a class="btn btn-gold" href="bind-bank.html">Bind Bank Account</a></div>';
        return;
      }
      area.innerHTML = `
        <form id="wForm">
          <div class="field"><label>Bank Account</label>
            <select class="input" id="bankId">${BANKS.map(b => `<option value="${b.id}">${b.bank_name} • ${b.account_number}</option>`).join('')}</select>
          </div>
          <div class="field"><label>Amount (₦)</label><input class="input" id="amount" type="number" oninput="calc()" placeholder="0.00" required /></div>
          <div class="pc-row"><span class="lbl">Fee:</span><span class="val" id="feeOut">₦0.00</span></div>
          <div class="pc-row"><span class="lbl">You receive:</span><span class="val" id="netOut">₦0.00</span></div>
          <button class="btn btn-gold btn-block" style="margin-top:14px;" type="submit">Request Withdrawal</button>
        </form>`;
      document.getElementById('wForm').addEventListener('submit', submitW);
    }

    window.calc = function () {
      const a = parseFloat(document.getElementById('amount').value) || 0;
      const fee = a * CFG.fee / 100;
      document.getElementById('feeOut').innerText = SIGNETT.money(fee);
      document.getElementById('netOut').innerText = SIGNETT.money(a - fee);
    };

    async function submitW(e) {
      e.preventDefault();
      const alertBox = document.getElementById('alert');
      alertBox.className = 'alert';
      const btn = e.target.querySelector('button');
      btn.disabled = true; btn.innerText = 'Processing...';
      const result = await callApi('/api/request-withdrawal', {
        amount: parseFloat(document.getElementById('amount').value),
        bank_account_id: document.getElementById('bankId').value
      });
      if (result.success) {
        alertBox.className = 'alert alert-success show';
        alertBox.textContent = '✅ Request submitted! Awaiting admin approval.';
        e.target.reset(); calc();
      } else {
        alertBox.className = 'alert alert-error show';
        alertBox.textContent = '❌ ' + (result.error || 'Failed');
      }
      btn.disabled = false; btn.innerText = 'Request Withdrawal';
    }
  </script>
</body>
</html>
