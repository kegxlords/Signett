<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — Signett Jewelries</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="gem">💎</div>
        <h1>SIGNETT</h1>
        <p>JEWELRIES</p>
      </div>
      <div class="auth-box">
        <div id="alert" class="alert"></div>
        <form id="regForm">
          <div class="field"><label>Full Name</label><input class="input" id="fullName" type="text" placeholder="Your full name" required /></div>
          <div class="field"><label>Phone Number</label><input class="input" id="phone" type="tel" placeholder="+234..." required /></div>
          <div class="field"><label>Email</label><input class="input" id="email" type="email" placeholder="you@example.com" required /></div>
          <div class="field"><label>Password</label><input class="input" id="password" type="password" placeholder="Min. 6 characters" required /></div>
          <div class="field"><label>Invitation Code (optional)</label><input class="input" id="refCode" type="text" placeholder="e.g. 85324057" /></div>
          <button class="btn btn-gold btn-block" id="regBtn" type="submit">Create Account</button>
        </form>
        <a class="auth-link" href="login.html">Already have an account? Sign in</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/api-client.js"></script>
  <script>
    // Pre-fill referral code from link
    const ref = new URLSearchParams(location.search).get('ref');
    if (ref) document.getElementById('refCode').value = ref;

    document.getElementById('regForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('regBtn');
      const alertBox = document.getElementById('alert');
      alertBox.className = 'alert';
      btn.disabled = true; btn.innerText = 'Creating account...';

      const { data, error } = await window.supabase.auth.signUp({
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
        options: {
          data: {
            full_name: document.getElementById('fullName').value.trim(),
            phone: document.getElementById('phone').value.trim(),
            referral_code: document.getElementById('refCode').value.trim()
          }
        }
      });

      if (error) {
        alertBox.className = 'alert alert-error show';
        alertBox.textContent = '❌ ' + error.message;
        btn.disabled = false; btn.innerText = 'Create Account';
        return;
      }

      alertBox.className = 'alert alert-success show';
      alertBox.textContent = '✅ Account created! Redirecting...';
      setTimeout(() => location.href = data.session ? '../app/home.html' : 'login.html', 1000);
    });
  </script>
</body>
</html>
