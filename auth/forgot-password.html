<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Signett Jewelries</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo"><div class="gem">💎</div><h1>SIGNETT</h1><p>JEWELRIES</p></div>
      <div class="auth-box">
        <div id="alert" class="alert"></div>
        <form id="fpForm">
          <div class="field"><label>Registered Email</label><input class="input" id="email" type="email" placeholder="you@example.com" required /></div>
          <button class="btn btn-gold btn-block" type="submit">Send Reset Link</button>
        </form>
        <a class="auth-link" href="login.html">← Back to sign in</a>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/api-client.js"></script>
  <script>
    document.getElementById('fpForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('alert');
      const { error } = await window.supabase.auth.resetPasswordForEmail(
        document.getElementById('email').value.trim(),
        { redirectTo: window.location.origin + '/auth/login.html' }
      );
      alertBox.className = 'alert alert-success show';
      alertBox.textContent = error ? '❌ ' + error.message : '📧 Reset link sent! Check your email.';
    });
  </script>
</body>
</html>
